name: Release theme package

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect a new package version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package.json version: $VERSION" >&2
            exit 1
          fi

          PREVIOUS_VERSION=""
          if [[ ! "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:package.json" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version || ""));
            ')"
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "Version is unchanged ($VERSION); skipping release."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          if TAG_REFS="$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" 2>/dev/null)"; then
            TAG_SHA="$(printf '%s\n' "$TAG_REFS" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')"
            if [[ -z "$TAG_SHA" ]]; then
              TAG_SHA="$(printf '%s\n' "$TAG_REFS" | awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }')"
            fi
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to a different commit; refusing to replace it." >&2
              exit 1
            fi
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            echo "Reusing $TAG at the current commit to finish an incomplete release."
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              exit "$status"
            fi
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

          echo "create_release=true" >> "$GITHUB_OUTPUT"

      - name: Report skipped release
        if: steps.version.outputs.create_release != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "No release created for package version $VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Package DaisyUI and Ghostty themes
        if: steps.version.outputs.create_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/daisyui-themes-${VERSION}.tar.gz" daisyui
          tar -czf "release-assets/ghostty-themes-${VERSION}.tar.gz" ghostty/themes

      - name: Build VS Code extension
        if: steps.version.outputs.create_release == 'true'
        working-directory: vscode/silo-terminal-theme
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx --yes @vscode/vsce package --out "../../release-assets/silo-terminal-theme-${VERSION}.vsix"

      - name: Create and push version tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "release-assets/daisyui-themes-${VERSION}.tar.gz" \
            "release-assets/ghostty-themes-${VERSION}.tar.gz" \
            "release-assets/silo-terminal-theme-${VERSION}.vsix" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
